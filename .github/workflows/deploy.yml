name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag for this deployment'
        required: false
        default: 'latest'
        type: string
      deploy_infrastructure:
        description: 'Deploy infrastructure (PostgreSQL + Redis)'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: deployment
  cancel-in-progress: false

jobs:
  build:
    name: 🏗️ Build & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔍 Lint Code
        run: npm run lint

      - name: 🏗️ Build Application
        run: npm run build

      - name: 📊 Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: dist/
          retention-days: 1

  docker-build:
    name: 🐳 Build Docker Image
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔐 Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔧 Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏷️ Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}

      - name: 🏗️ Build and Push Docker Image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  deploy-infrastructure:
    name: 🏗️ Deploy Infrastructure
    runs-on: ubuntu-latest
    if: ${{ inputs.deploy_infrastructure == true }}
    environment: production
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔐 Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_KEY }}

      - name: 📝 Create Environment File
        run: |
          cat > .env.production << EOF
          APP_PORT=3000
          APP_ENV=production
          NODE_ENV=production
          DATABASE_HOST=alert-monitor-postgres
          DATABASE_PORT=5432
          DATABASE_USERNAME=${{ secrets.DB_USERNAME }}
          DATABASE_PASSWORD=${{ secrets.DB_PASSWORD }}
          DATABASE_NAME=${{ secrets.DB_NAME }}
          REDIS_USERNAME=${{ secrets.REDIS_USERNAME }}
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          BOT_TOKEN=${{ secrets.BOT_TOKEN }}
          PUBLIC_ALERT_GROUP_URL=${{ secrets.PUBLIC_ALERT_GROUP_URL }}
          APP_VERSION=${{ inputs.version || github.sha }}
          EOF

      - name: 📤 Deploy Infrastructure to Server
        run: |
          # Copy files to server
          scp -o StrictHostKeyChecking=no -r \
            docker-compose.infrastructure.yml \
            config/ \
            scripts/ \
            .env.production \
            deployer@${{ secrets.HETZNER_SERVER_IP }}:/opt/alert-monitor/
          
          # Run deployment script
          ssh -o StrictHostKeyChecking=no deployer@${{ secrets.HETZNER_SERVER_IP }} << 'EOF'
            cd /opt/alert-monitor
            chmod +x scripts/deploy-infrastructure.sh
            ./scripts/deploy-infrastructure.sh
          EOF

  deploy-application:
    name: 🚀 Deploy Application
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: always() && needs.docker-build.result == 'success'
    environment: production
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔐 Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_KEY }}

      - name: 🔐 Login to Container Registry on Server
        run: |
          ssh -o StrictHostKeyChecking=no deployer@${{ secrets.HETZNER_SERVER_IP }} << EOF
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
          EOF

      - name: 🔤 Convert Repository to Lowercase
        id: lowercase
        run: echo "repository=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: 📝 Create Environment File
        run: |
          cat > .env.production << EOF
          APP_PORT=3000
          APP_ENV=production
          NODE_ENV=production
          DATABASE_HOST=alert-monitor-postgres
          DATABASE_PORT=5432
          DATABASE_USERNAME=${{ secrets.DB_USERNAME }}
          DATABASE_PASSWORD=${{ secrets.DB_PASSWORD }}
          DATABASE_NAME=${{ secrets.DB_NAME }}
          REDIS_USERNAME=${{ secrets.REDIS_USERNAME }}
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          BOT_TOKEN=${{ secrets.BOT_TOKEN }}
          PUBLIC_ALERT_GROUP_URL=${{ secrets.PUBLIC_ALERT_GROUP_URL }}
          APP_VERSION=${{ inputs.version || github.sha }}
          DOCKER_IMAGE=${{ env.REGISTRY }}/${{ steps.lowercase.outputs.repository }}:main
          EOF

      - name: 📤 Deploy Application to Server
        run: |
          # Copy files to server
          scp -o StrictHostKeyChecking=no -r \
            docker-compose.prod.yml \
            scripts/ \
            .env.production \
            deployer@${{ secrets.HETZNER_SERVER_IP }}:/opt/alert-monitor/
          
          # Run deployment script
          ssh -o StrictHostKeyChecking=no deployer@${{ secrets.HETZNER_SERVER_IP }} << EOF
            cd /opt/alert-monitor
            chmod +x scripts/deploy-application.sh
            
            DOCKER_IMAGE_TAG="${{ env.REGISTRY }}/${{ steps.lowercase.outputs.repository }}:main"
            docker pull \$DOCKER_IMAGE_TAG
            
            # Deploy application (skip build since we pull from registry)  
            ./scripts/deploy-application.sh ${{ inputs.version || github.sha }} true
          EOF

  migrate:
    name: 🗃️ Run Database Migrations
    runs-on: ubuntu-latest
    needs: [deploy-application]
    if: always() && needs.deploy-application.result == 'success'
    environment: production
    
    steps:
      - name: 🔐 Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_KEY }}

      - name: 🗃️ Run Migrations
        run: |
          ssh -o StrictHostKeyChecking=no deployer@${{ secrets.HETZNER_SERVER_IP }} << 'EOF'
            cd /opt/alert-monitor
            
            # Wait for application to be ready
            timeout 60 bash -c 'until curl -s http://localhost:3000/api/health; do sleep 2; done'
            
            # Run migrations using production script
            docker-compose -f docker-compose.prod.yml exec -T app npm run typeorm:prod -- migration:run --env=production
          EOF

  health-check:
    name: 🏥 Health Check
    runs-on: ubuntu-latest
    needs: [migrate]
    if: always() && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    environment: production
    
    steps:
      - name: 🏥 Check Application Health
        run: |
          # Wait a bit for application to stabilize
          sleep 10
          
          # Check health endpoint
          response=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.HETZNER_SERVER_IP }}:3000/api/health)
          
          if [ "$response" = "200" ]; then
            echo "✅ Application is healthy (HTTP $response)"
          else
            echo "❌ Application health check failed (HTTP $response)"
            exit 1
          fi

      - name: 📊 Get Deployment Status
        run: |
          curl -s http://${{ secrets.HETZNER_SERVER_IP }}:3000/api/health | jq '.'

  notify:
    name: 📢 Notify
    runs-on: ubuntu-latest
    needs: [health-check]
    if: always()
    environment: production
    
    steps:
      - name: 📢 Deployment Success
        if: needs.health-check.result == 'success'
        run: |
          echo "🎉 Deployment successful!"
          echo "Application is available at: http://${{ secrets.HETZNER_SERVER_IP }}:3000"
          echo "Health check: http://${{ secrets.HETZNER_SERVER_IP }}:3000/api/health"

      - name: 📢 Deployment Failed
        if: needs.health-check.result != 'success'
        run: |
          echo "❌ Deployment failed!"
          exit 1
