version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: alert-monitor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-alert_bot}
      POSTGRES_USER: ${DATABASE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=uk_UA.UTF-8 --lc-ctype=uk_UA.UTF-8"
    ports:
      - "0.0.0.0:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-postgres} -d ${DATABASE_NAME:-alert_bot}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 256M
    networks:
      - alert-monitor-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: alert-monitor-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_USERNAME: ${REDIS_USERNAME:-alertapp}
    ports:
      - "0.0.0.0:6379:6379"
    volumes:
      - redis_data:/data
      - ./config/redis.conf:/etc/redis/redis.conf:ro
      - ./config/redis-users.acl:/etc/redis/users.acl:ro
    command: |
      sh -c '
        # Substitute environment variables in config files
        envsubst < /etc/redis/redis.conf > /tmp/redis.conf
        envsubst < /etc/redis/users.acl > /tmp/users.acl
        # Start Redis with processed config
        redis-server /tmp/redis.conf --aclfile /tmp/users.acl
      '
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli -a $$REDIS_PASSWORD ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 128M
    networks:
      - alert-monitor-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redisinsight:
    image: redislabs/redisinsight:latest
    container_name: alert-monitor-redisinsight
    restart: unless-stopped
    ports:
      - "0.0.0.0:5540:5540"
    volumes:
      - redisinsight_data:/db
    environment:
      - REDISINSIGHT_HOST=0.0.0.0
      - REDISINSIGHT_PORT=5540
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - alert-monitor-network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

networks:
  alert-monitor-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/alert-monitor/data/postgres
  
  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/alert-monitor/data/redis
      
  redisinsight_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/alert-monitor/data/redisinsight
